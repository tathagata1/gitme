<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
    <title>GitGod</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <strong>GitGod</strong>
        </div>

        <button class="repository-picker" id="choose-repository" title="Open repository">
          <span class="repo-icon">⌘</span>
          <span class="repo-picker-copy"><strong id="repo-name">Choose repository</strong><span id="repo-path">No repository open</span></span>
          <span class="picker-chevron">⌄</span>
        </button>

        <nav class="nav-list" aria-label="Primary navigation">
          <button class="nav-item active" data-view="workspace"><span>⌂</span>Workspace</button>
          <button class="nav-item" data-view="history"><span>↺</span>History <b id="history-count">0</b></button>
          <button class="nav-item" data-view="raw"><span>›_</span>Command</button>
        </nav>

        <div class="sidebar-actions">
          <button data-action="changes.commit">＋ <span>Commit staged</span></button>
          <button data-action="branch.create">⑂ <span>New branch</span></button>
          <button data-action="remote.fetch">⇣ <span>Fetch</span></button>
          <button data-action="remote.pull">↓ <span>Pull</span></button>
          <button data-action="remote.push">↑ <span>Push</span></button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1 id="page-title">Workspace</h1>
          <div class="topbar-actions">
            <div class="branch-chip" id="branch-chip"><span>⑂</span><strong>No branch</strong></div>
            <button class="icon-button" id="refresh" aria-label="Refresh repository" title="Refresh repository">↻</button>
          </div>
        </header>

        <section class="view active" id="workspace-view">
          <div class="empty-state" id="empty-state">
            <div class="empty-art"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="git-symbol">⑂</div></div>
            <h2>Open a repository</h2>
            <p>Choose a Git folder to get started.</p>
            <div class="empty-actions"><button class="primary-button large" id="empty-open">Open folder</button><button class="secondary-button large" id="initialize-repository">New repository</button></div>
          </div>

          <div class="dashboard hidden" id="dashboard">
            <div class="workspace-grid">
              <section class="panel changes-panel">
                <div class="panel-header"><h3>Changes <span class="count" id="changes-count">0</span></h3><button class="text-button" id="select-all-changes">Select all</button></div>
                <div class="file-list" id="changes-list"></div>
                <div class="panel-footer"><span id="changes-selected">0 selected</span><button class="compact-button" data-action="changes.stage">Stage <span>→</span></button></div>
              </section>

              <section class="panel staged-panel">
                <div class="panel-header"><h3>Staged <span class="count green" id="staged-count">0</span></h3><button class="text-button" id="select-all-staged">Select all</button></div>
                <div class="file-list" id="staged-list"></div>
                <div class="panel-footer"><button class="text-button" data-action="changes.unstage">Unstage</button><button class="compact-button accent" data-action="changes.commit">Commit <span>→</span></button></div>
              </section>

              <section class="panel branches-panel">
                <div class="panel-header"><h3>Branches <span class="count" id="branches-count">0</span></h3><button class="round-button" data-action="branch.create" title="Create branch">＋</button></div>
                <div class="branch-list" id="branch-list"></div>
              </section>

              <section class="panel activity-panel">
                <div class="panel-header"><h3>Commits</h3><span class="remote-badge" id="remote-badge">Local only</span></div>
                <div class="commit-list" id="commit-list"></div>
              </section>

              <section class="panel remotes-panel">
                <div class="panel-header"><h3>Remotes <span class="count" id="remotes-count">0</span></h3><button class="compact-button" id="show-add-remote">＋ Add</button></div>
                <form class="remote-add-form hidden" id="remote-add-form">
                  <label><span>Name</span><input id="remote-name" autocomplete="off" spellcheck="false" placeholder="origin" /></label>
                  <label><span>URL</span><input id="remote-url" autocomplete="off" spellcheck="false" placeholder="https://github.com/owner/repository.git" /></label>
                  <button class="secondary-button" id="cancel-add-remote" type="button">Cancel</button>
                  <button class="primary-button" type="submit">Preview</button>
                </form>
                <div class="remote-list" id="remote-list"></div>
              </section>
            </div>
          </div>
        </section>

        <section class="view" id="history-view">
          <div class="history-layout"><div class="panel history-list" id="history-list"></div><div class="panel history-detail" id="history-detail"><div class="blank-slate">Select a command</div></div></div>
        </section>

        <section class="view" id="raw-view">
          <div class="panel raw-card"><div class="raw-input-row"><span>$</span><input id="raw-input" aria-label="Git command" autocomplete="off" spellcheck="false" placeholder="git log --oneline --graph --all" /><button class="primary-button" id="preview-raw">Preview</button></div><div class="warning-note"><strong>Careful</strong><span>Review destructive commands before they run.</span></div></div>
        </section>
      </main>
    </div>

    <section class="command-dock" id="command-dock" aria-live="polite">
      <div class="dock-grip"></div>
      <div class="dock-header"><div><span class="risk-badge" id="risk-badge">NORMAL</span><strong id="preview-summary">Command preview</strong></div><button class="dock-close" id="clear-preview" aria-label="Clear preview">×</button></div>
      <div class="command-line"><span>$</span><code id="preview-command"></code><button id="copy-command" title="Copy command">Copy</button></div>
      <p id="preview-explanation"></p>
      <div class="dock-actions"><span class="countdown-status">Runs in <strong id="countdown-seconds">5</strong>s</span><button class="secondary-button cancel-command" id="cancel-command">Cancel</button></div>
    </section>

    <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal"><div class="modal-icon" id="modal-icon">⑂</div><h2 id="modal-title"></h2><p id="modal-message"></p><label class="modal-field hidden" id="modal-field-wrap"><span id="modal-field-label"></span><input id="modal-field" /></label><pre class="modal-command hidden" id="modal-command"></pre><div class="modal-buttons"><button class="secondary-button" id="modal-cancel">Cancel</button><button class="primary-button" id="modal-confirm">Continue</button></div></div>
    </div>
    <div class="toast-stack" id="toast-stack"></div>

    <script src="commands.js"></script>
    <script src="app.js"></script>
  </body>
</html>
